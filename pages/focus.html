<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dayora - Focus Room</title>
  <link rel="stylesheet" href="../css/planner.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/app.css">
  <script src="../js/utils/theme.js"></script>
</head>
<body data-protected>
  <div class="app">

    <div class="sidebar">
      <div class="logo">
        <img src="https://api.iconify.design/lucide/sprout.svg?color=%23ffffff" alt="logo">
        <span>Dayora</span>
      </div>
      <div class="menu">
        <a href="dashboard.html" class="menu-link"><img src="https://api.iconify.design/lucide/layout-dashboard.svg?color=%23cfe3cf" alt="">Dashboard</a>
        <a href="tasks.html" class="menu-link"><img src="https://api.iconify.design/lucide/list-checks.svg?color=%23cfe3cf" alt="">Tasks</a>
        <a href="planner.html" class="menu-link"><img src="https://api.iconify.design/lucide/calendar.svg?color=%23cfe3cf" alt="">Planner</a>
        <a href="focus.html" class="menu-link active"><img src="https://api.iconify.design/lucide/timer.svg?color=%231f4a33" alt="">Focus Room</a>
        <a href="analytics.html" class="menu-link"><img src="https://api.iconify.design/lucide/activity.svg?color=%23cfe3cf" alt="">Analytics</a>
        <a href="settings.html" class="menu-link"><img src="https://api.iconify.design/lucide/settings.svg?color=%23cfe3cf" alt="">Settings</a>
      </div>
      <a href="home.html" class="menu-link" data-logout><img src="https://api.iconify.design/lucide/log-out.svg?color=%23cfe3cf" alt="">Log Out</a>
    </div>

    <div class="main">

      <div class="topbar">
        <div></div>
        <div class="top-right">
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false" title="Dark mode"><svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <div class="user">
            <div class="avatar">..</div>
            <div>
              <div class="user-name">Loading...</div>
              <div class="user-role">Student</div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-head">
        <div>
          <h1>Focus Room</h1>
          <p>One thing at a time. Pick a task, start the timer, and protect your focus.</p>
        </div>
      </div>

      <div class="focus-wrap">

        <!-- the timer -->
        <div class="panel timer-panel">
          <div class="mode-tabs" id="mode-tabs">
            <button type="button" data-mode="focus" class="active">Focus</button>
            <button type="button" data-mode="short">Short break</button>
            <button type="button" data-mode="long">Long break</button>
          </div>

          <div class="ring">
            <svg width="260" height="260" viewBox="0 0 260 260" aria-hidden="true">
              <circle class="track" cx="130" cy="130" r="112"></circle>
              <circle class="bar" id="ring-bar" cx="130" cy="130" r="112"></circle>
            </svg>
            <div class="time"><span id="time">25:00</span><small id="time-note">Ready</small></div>
          </div>

          <div class="timer-controls">
            <button type="button" class="btn-primary" id="start-btn">Start</button>
            <button type="button" class="btn-ghost" id="finish-btn" hidden>Finish &amp; save</button>
            <button type="button" class="btn-ghost" id="reset-btn">Reset</button>
          </div>

          <label class="task-picker" id="task-picker">
            Working on
            <select id="task-select"><option value="">Nothing in particular</option></select>
          </label>
        </div>

        <div style="display:flex;flex-direction:column;gap:20px;">
          <!-- today -->
          <div class="panel">
            <h2>Today</h2>
            <p class="hint" id="today-text">Loading...</p>
            <div class="progress-bar"><i id="goal-bar" style="width:0%"></i></div>
            <p class="hint" style="margin-top:12px;" id="streak-text"></p>
          </div>

          <!-- history -->
          <div class="panel">
            <h2>Recent sessions</h2>
            <div class="list" id="recent"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../js/utils/storage.js"></script>
  <script src="../js/utils/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/focus.js"></script>
</body>
</html>
