<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Dayora</title>
  <link rel="stylesheet" href="../css/login.css">
</head>

<body class="auth-page">

  <a href="../index.html" class="back-home">&larr; Back to home</a>

  <main class="auth-layout">

    <!-- Left side -->
    <section class="auth-side">
      <h1>Your Day,<br><span>Your Way.</span></h1>
      <p>Everything you plan, in one calm place.</p>
    </section>

    <!-- Right side -->
    <section class="auth-card">

      <input type="radio" name="mode" id="mode-login" class="mode" checked>
      <input type="radio" name="mode" id="mode-register" class="mode">

      <div class="tabs">
        <label for="mode-login">Login</label>
        <label for="mode-register">Sign up</label>
      </div>

      <!-- Login form -->
      <form class="auth-form" id="loginForm">
        <h2>Welcome back</h2>
        <p class="muted">Log in to continue planning your day.</p>

        <label>Email
          <input type="email" placeholder="you@example.com" required>
        </label>

        <label>Password
          <input type="password" placeholder="Your password" required>
        </label>

        <button type="submit" class="btn">Login</button>
      </form>

      <!-- Sign up form -->
      <form class="auth-form" id="registerForm">
        <h2>Create your account</h2>
        <p class="muted">It takes less than a minute.</p>

        <label>Full name
          <input type="text" placeholder="Your name" required>
        </label>

        <label>Email
          <input type="email" placeholder="you@example.com" required>
        </label>

        <label>Password
          <input type="password" placeholder="At least 6 characters" minlength="6" required>
        </label>

        <button type="submit" class="btn">Create account</button>
      </form>

    </section>
  </main>

</body>
</html>
