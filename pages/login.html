<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Dayora</title>
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/utils/theme.js"></script>
</head>

<body class="auth-page">

  <button class="theme-toggle floating" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false" title="Dark mode"><svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>

  <a href="home.html" class="back-home">&larr; Back to home</a>

  <main class="auth-layout">

    <!-- Left side -->
    <section class="auth-side">
      <h1>Your Day,<br><span>Your Way.</span></h1>
      <p>Everything you plan, in one calm place.</p>
    </section>

    <!-- Right side -->
    <section class="auth-card">

      <input type="radio" name="mode" id="mode-login" class="mode" checked>
      <input type="radio" name="mode" id="mode-register" class="mode">

      <div class="tabs">
        <label for="mode-login">Login</label>
        <label for="mode-register">Sign up</label>
      </div>

      <!-- Login form -->
      <form class="auth-form" id="loginForm">
        <h2>Welcome back</h2>
        <p class="muted">Log in to continue planning your day.</p>

        <label>Email
          <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </label>

        <label>Password
          <input type="password" name="password" placeholder="Your password" autocomplete="current-password" required>
        </label>

        <p class="form-error" role="alert"></p>
        <button type="submit" class="btn">Login</button>
      </form>

      <!-- Sign up form -->
      <form class="auth-form" id="registerForm">
        <h2>Create your account</h2>
        <p class="muted">It takes less than a minute.</p>

        <label>Full name
          <input type="text" name="name" placeholder="Your name" minlength="2" maxlength="80" autocomplete="name" required>
        </label>

        <label>Email
          <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </label>

        <label>Password
          <input type="password" name="password" placeholder="At least 6 characters" minlength="6" maxlength="72" autocomplete="new-password" required>
        </label>

        <p class="form-error" role="alert"></p>
        <button type="submit" class="btn">Create account</button>
      </form>

    </section>
  </main>

  <script src="../js/utils/storage.js"></script>
  <script src="../js/utils/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
