<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/contact-us.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Document</title>
</head>

<body>
    <div class="card-contact">

        <div class="w-25">

            <div class="contact-item">
                <div class="icon">
                    <img src="https://api.iconify.design/lucide/map-pin.svg?color=%231e3a29" alt="Location">
                </div>
                <div class="text">
                    <h3>Address</h3>
                    <p>Sunrise, MTZ</p>
                    <p>(+20) 100 123 4567</p>
                </div>
            </div>


            <div class="contact-item">
                <div class="icon">
                    <img src="https://api.iconify.design/lucide/phone.svg?color=%231e3a29" alt="Phone">
                </div>
                <div class="text">
                    <h3>Phone</h3>
                    <p>+0123 456 7897</p>
                    <p>+0203 456 0878</p>
                </div>
            </div>


            <div class="contact-item">
                <div class="icon">
                    <img src="https://api.iconify.design/lucide/mail.svg?color=%231e3a29" alt="Email">
                </div>
                <div class="text">
                    <h3>Email</h3>
                    <p>contact@yourdomain.com</p>
                    <p>info@yourdomain.com</p>
                </div>
            </div>
        </div>


        <main class="main">
            <h2>Send us a message</h2>
            
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Enter your name</label>
                <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="your name">
            </div>
            
        

            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Enter your email</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
            </div>
            <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Enter your message</label>
                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
            </div>


        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
