<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="card">

  <!-- رابط العنوان -->
  <a href="https://maps.google.com" target="_blank" class="contact-link">
    <div class="icon">
      <img src="https://api.iconify.design/lucide/map-pin.svg?color=%231e3a29" alt="Location">
    </div>
    <div class="text">
      <h3>Address</h3>
      <p>Sunrise, MTZ</p>
      <p>(+20) 100 123 4567</p>
    </div>
  </a>

  <hr>

  <!-- رابط الهاتف -->
  <a href="tel:+01234567897" class="contact-link">
    <div class="icon">
      <img src="https://api.iconify.design/lucide/phone.svg?color=%231e3a29" alt="Phone">
    </div>
    <div class="text">
      <h3>Phone</h3>
      <p>+0123 456 7897</p>
      <p>+0203 456 0878</p>
    </div>
  </a>

  <hr>

  <!-- رابط الإيميل -->
  <a href="mailto:contact@yourdomain.com" class="contact-link">
    <div class="icon">
      <img src="https://api.iconify.design/lucide/mail.svg?color=%231e3a29" alt="Email">
    </div>
    <div class="text">
      <h3>Email</h3>
      <p>contact@yourdomain.com</p>
      <p>info@yourdomain.com</p>
    </div>
  </a>

  <!-- ورقة الشجر في الأسفل -->
  <div class="leaf">
    <img src="https://api.iconify.design/lucide/sprout.svg?color=%238fae92" alt="Leaf">
  </div>

</div>
  
</body>
</html>
