<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dayora - Analytics</title>
  <link rel="stylesheet" href="../css/planner.css">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/app.css">
  <script src="../js/utils/theme.js"></script>
</head>
<body data-protected>
  <div class="app">

    <div class="sidebar">
      <div class="logo">
        <img src="https://api.iconify.design/lucide/sprout.svg?color=%23ffffff" alt="logo">
        <span>Dayora</span>
      </div>
      <div class="menu">
        <a href="dashboard.html" class="menu-link"><img src="https://api.iconify.design/lucide/layout-dashboard.svg?color=%23cfe3cf" alt="">Dashboard</a>
        <a href="tasks.html" class="menu-link"><img src="https://api.iconify.design/lucide/list-checks.svg?color=%23cfe3cf" alt="">Tasks</a>
        <a href="planner.html" class="menu-link"><img src="https://api.iconify.design/lucide/calendar.svg?color=%23cfe3cf" alt="">Planner</a>
        <a href="focus.html" class="menu-link"><img src="https://api.iconify.design/lucide/timer.svg?color=%23cfe3cf" alt="">Focus Room</a>
        <a href="analytics.html" class="menu-link active"><img src="https://api.iconify.design/lucide/activity.svg?color=%231f4a33" alt="">Analytics</a>
        <a href="settings.html" class="menu-link"><img src="https://api.iconify.design/lucide/settings.svg?color=%23cfe3cf" alt="">Settings</a>
      </div>
      <a href="home.html" class="menu-link" data-logout><img src="https://api.iconify.design/lucide/log-out.svg?color=%23cfe3cf" alt="">Log Out</a>
    </div>

    <div class="main">

      <div class="topbar">
        <div></div>
        <div class="top-right">
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false" title="Dark mode"><svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <div class="user">
            <div class="avatar">..</div>
            <div>
              <div class="user-name">Loading...</div>
              <div class="user-role">Student</div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-head">
        <div>
          <h1>Analytics</h1>
          <p>See how your focus and your tasks are going.</p>
        </div>
      </div>

      <div class="kpis">
        <div class="stat-card">
          <div class="icon"><img src="https://api.iconify.design/lucide/clock.svg?color=%232e5f44" alt=""></div>
          <div><h3>Total focus time</h3><p class="number" id="k-total">-</p><p class="note" id="k-total-note"></p></div>
        </div>
        <div class="stat-card">
          <div class="icon"><img src="https://api.iconify.design/lucide/timer.svg?color=%232e5f44" alt=""></div>
          <div><h3>Focus sessions</h3><p class="number" id="k-sessions">-</p><p class="note" id="k-sessions-note"></p></div>
        </div>
        <div class="stat-card">
          <div class="icon"><img src="https://api.iconify.design/lucide/sprout.svg?color=%232e5f44" alt=""></div>
          <div><h3>Current streak</h3><p class="number" id="k-streak">-</p><p class="note" id="k-streak-note"></p></div>
        </div>
        <div class="stat-card">
          <div class="icon"><img src="https://api.iconify.design/lucide/list-checks.svg?color=%232e5f44" alt=""></div>
          <div><h3>Tasks completed</h3><p class="number" id="k-rate">-</p><p class="note" id="k-rate-note"></p></div>
        </div>
      </div>

      <div class="panel-grid two">
        <div class="panel">
          <h2>Focus time, last 7 days</h2>
          <div class="bars" id="week-bars"></div>
        </div>

        <div class="panel">
          <h2>Tasks</h2>
          <div class="breakdown" id="status-rows"></div>
          <h2 style="margin-top:22px;">By priority</h2>
          <div class="breakdown" id="priority-rows"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/utils/storage.js"></script>
  <script src="../js/utils/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/analytics.js"></script>
</body>
</html>
